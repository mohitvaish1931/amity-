# Sentinel X verification: the same pipeline as `npm run check` (typecheck → lint → test → build),
# followed by Playwright E2E on the production build.
# No secrets or external credentials are used or needed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck, lint, test, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Node 22 bundles npm 10; the lockfile must be accepted by it (see progress.md, CI fix).
      - name: Show tool versions
        run: |
          echo "node $(node --version)"
          echo "npm $(npm --version)"

      - name: Install dependencies (npm ci, lockfile only)
        id: install
        run: npm ci

      # Each check runs whenever dependencies installed, so one failure never hides another.
      # Any failed step still fails the job.
      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:ci

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # Browser E2E on the production build from the step above (no second build).
      - name: Install Playwright Chromium
        id: pwinstall
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        id: e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.pwinstall.outcome == 'success' }}
        env:
          E2E_SKIP_BUILD: "1"
          PW_CHANNELS: chromium
        run: npm run test:e2e

      - name: Upload test report
        if: ${{ !cancelled() && (steps.test.outcome != 'skipped' || steps.e2e.outcome != 'skipped') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: ${{ always() }}
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ passed";; failure) echo "❌ failed";; skipped) echo "⏭ skipped";; *) echo "⚪ ${1:-not run}";; esac; }
          {
            echo "## Sentinel X verification"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Install (npm ci) | $(icon "$INSTALL") |"
            echo "| Typecheck | $(icon "$TYPECHECK") |"
            echo "| Lint | $(icon "$LINT") |"
            echo "| Test | $(icon "$TEST") |"
            echo "| Build | $(icon "$BUILD") |"
            echo "| E2E (Playwright, Chromium) | $(icon "$E2E") |"
          } >> "$GITHUB_STEP_SUMMARY"
